name: Deploy to Pages

# 部署到 GitHub Pages。
#
# 前置条件：仓库必须是**公开**的 —— 免费账号的私有仓库不支持 Pages（实测 HTTP 422）。
#
# ⚠️ 转公开意味着 games/ 下的剧本全文可被搜索、可被 git clone。
#    介意的话，把剧本挪到私有仓库、用 PAT 在构建时拉取，见 docs/deployment.md。
#
# 线上地址：https://m505569537.github.io/huaben/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验剧本
        run: node tools/validate.mjs

      - name: 打包
        run: node tools/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
