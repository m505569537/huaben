name: Deploy to Pages

# ⚠️ 私有仓库 + 免费账号不支持 GitHub Pages（GitHub 的限制，已实测）。
#    两种解决办法：
#      1. 把仓库转成公开 → 把下面 on: 里的 push/main 两行放开即可自动部署
#      2. 继续用私有仓库 → 改用 Vercel / Netlify 连仓库部署，见 README
#
# 目前只保留手动触发，避免每次 push 都报红。

on:
  workflow_dispatch:
#  push:
#    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验剧本
        run: node tools/validate.mjs

      - name: 打包
        run: node tools/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
